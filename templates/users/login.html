{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white bg-opacity-60 backdrop-blur-md shadow-lg rounded-xl p-8 mt-12">
  <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🔑 Login</h1>

  <form method="post" class="space-y-6">
    {% csrf_token %}
    
    {% for field in form %}
      <div>
        <label class="block text-gray-700 font-medium mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-600 text-sm mt-1">{{ field.errors }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <button type="submit" 
            class="w-full bg-gray-600 text-white py-2 px-6 rounded-lg shadow hover:bg-orange-600 transition">
      Login
    </button>
  </form>

  <p class="text-center mt-4 text-gray-700">
    Don't have an account? 
    <a href="{% url 'signup' %}" class="text-orange-600 hover:text-orange-700 font-medium">Sign up</a>
  </p>
</div>
{% endblock %}
