<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Result</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .result { padding: 20px; border: 1px solid #ccc; background: #f9f9f9; }
  </style>
</head>
<body>
  <h2>Your Test Result</h2>

  <div class="result">
    <p><strong>Total Score:</strong> {{ score }}</p>
    <p><strong>IQ Category:</strong> {{ iq_category }}</p>
  </div>

  <p><a href="{% url 'home' %}">Back to Home</a></p>
</body>
</html>
