{% extends "base.html" %}

{% block title %}Aptitude Test - Question {{ question_index|add:1 }}{% endblock %}

{% block content %}
  <div class="max-w-3xl mx-auto bg-white bg-opacity-80 backdrop-blur-md shadow-lg rounded-xl p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Aptitude Test</h2>
    <p class="progress text-gray-600 mb-6 font-medium">
      Question {{ question_index|add:1 }} of {{ total_questions }}
    </p>

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <!-- Question -->
      <fieldset class="border border-gray-300 rounded-lg p-6">
        <legend class="font-semibold text-gray-900 mb-4">
          {{ question.text }}
        </legend>

        <div class="space-y-3">
          {% for choice in choices %}
            <label class="flex items-center space-x-3 cursor-pointer">
              <input 
                type="radio" 
                name="choice" 
                value="{{ choice.id }}" 
                required 
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300"
              >
              <span class="text-gray-700">{{ choice.text }}</span>
            </label>
          {% endfor %}
        </div>
      </fieldset>

      <!-- Next/Finish Button -->
      <button 
        type="submit" 
        class="w-full bg-gray-600 text-white py-3 rounded-lg shadow hover:bg-orange-700 transition"
      >
        {% if question_index|add:1 == total_questions %}
          Finish Test
        {% else %}
          Next
        {% endif %}
      </button>
    </form>
  </div>
{% endblock %}
